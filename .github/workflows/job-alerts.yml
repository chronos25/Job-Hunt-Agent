name: Job alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay scheduled runs)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # to commit data/seen_jobs.json

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find, score and alert
        run: python -m job_assistant.main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}

      - name: Remember seen jobs
        if: always()
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_jobs.json docs/jobs.json
          git diff --cached --quiet || (git commit -m "Update seen jobs [skip ci]" && git pull --rebase -q origin main && git push)
