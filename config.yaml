# Job Search Assistant configuration.
# Edit this file to change what jobs are searched, filtered and alerted.

search:
  # Each term is searched across India on LinkedIn, Indeed and Naukri.
  terms:
    - "Senior Backend Engineer"
    - "Senior Software Engineer Node.js"
    - "Lead Software Engineer Backend"
    - "SDE 3 Backend"
    - "Technical Lead Node.js"
  country: "India"
  hours_old: 3            # only fetch jobs posted in the last N hours
  results_per_search: 25

sources:
  linkedin: true
  indeed: true
  naukri: true
  instahyre: true
  remote_boards: true     # Remotive + RemoteOK

instahyre:
  skills: ["Node.js", "Backend Development", "Python"]
  years: 6

filters:
  # Job location must contain one of these words (case-insensitive). Empty list = any location.
  # Indeed often reports only the state ("MH, India"), hence the state names/codes.
  locations: ["bengaluru", "bangalore", "pune", "mumbai", "navi mumbai", "thane", "hyderabad",
              "maharashtra", "karnataka", "telangana", "MH", "KA", "TS", "TG",
              "remote", "work from home", "worldwide", "anywhere", "apac", "asia"]
  # Title must contain at least one of these words.
  title_include: ["backend", "back end", "back-end", "software engineer", "software developer",
                  "sde", "node", "nodejs", "python", "platform", "lead", "full stack", "fullstack",
                  "member of technical staff", "mts", "ai engineer", "developer"]
  title_exclude: ["intern", "fresher", "junior", "trainee", "frontend", "front end", "front-end",
                  "android", "ios", "qa", "test", "testing", "sdet", "sales", "support", "data analyst",
                  "salesforce", "sap", "java", "j2ee", "spring", ".net", "dotnet", "c#", "php", "rails",
                  "ruby", "react developer", "director", "vp", "manager", "snaplogic"]
  # When the source reports employee count, skip companies smaller than this.
  min_company_employees: 1000
  exclude_companies: []   # e.g. ["Tata Consultancy Services", "TCS"]

profile:
  resume_file: profile/resume.md   # or set the RESUME_TEXT environment variable
  experience_years: 6.5
  target_salary_lpa: [25, 35]
  preferences: |
    - Prefer large, stable companies: big MNCs or established product companies with 1,000-10,000+ employees
      and a good growth outlook. Avoid early-stage startups, staffing agencies and body-shopping consultancies.
    - Role should be mostly backend engineering (Node.js/TypeScript/Python, microservices, queues, Kafka,
      databases), with some hands-on DevOps (Docker, Kubernetes, AWS, CI/CD) and/or AI/LLM agent work.
    - Seniority: Senior Engineer, SDE-2/SDE-3, Lead Engineer or Technical Lead (hands-on).
    - Expected compensation: 25-35 LPA.

scoring:
  model: claude-opus-5-5
  effort: low               # low keeps cost down; raise to medium for more careful scoring
  min_score_to_alert: 70    # 0-100
  max_jobs_per_run: 30      # caps Claude calls per run; overflow is scored next run

alerts:
  send_rejected_summary: false   # true = also send a one-line summary of low-scoring jobs
